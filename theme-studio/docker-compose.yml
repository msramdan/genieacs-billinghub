# Jalankan dari root repo:
#   cp theme-studio/.env.example theme-studio/.env   # sekali
#   docker compose -f theme-studio/docker-compose.yml up -d --build
#
# Semua setting UI ACS Studio ada di theme-studio/.env
# (lihat .env.example)

services:
  acs-studio:
    container_name: ACS-Studio
    build:
      context: ..
      dockerfile: theme-studio/Dockerfile
    network_mode: host
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      # Docker: satu proses serve UI+API di 5173
      - PORT=5173
      - NODE_ENV=production
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:-billinghub01}
    restart: unless-stopped
